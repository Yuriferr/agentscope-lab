services:
  lab:
    build: .
    ports:
      - '127.0.0.1:4310:4310'
    volumes:
      - lab-data:/app/data
    environment:
      AGENT_ALLOWED_ORIGINS: http://host.docker.internal:8000,http://host.docker.internal:11434,http://host.docker.internal:1234
    extra_hosts:
      - 'host.docker.internal:host-gateway'
volumes:
  lab-data:
